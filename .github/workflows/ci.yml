name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: msbuild JulesClient.sln /t:Restore /p:Configuration=Release

    - name: Build
      run: msbuild JulesClient.sln /p:Configuration=Release

    - name: Run tests
      run: dotnet test JulesClient.Tests/JulesClient.Tests.csproj --configuration Release

    - name: Check formatting
      run: dotnet format JulesClient.sln --verify-no-changes --no-restore

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Generate Release Tag
      id: tag_gen
      shell: pwsh
      run: |
        if ("${{ github.ref }}".StartsWith("refs/tags/")) {
          $tagName = "${{ github.ref_name }}"
        } else {
          $tagName = "v1.0.${{ github.run_number }}"
        }
        Write-Output "tag_name=$tagName" >> $env:GITHUB_OUTPUT

    - name: Create signing certificate
      id: create_cert
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path AppPackages | Out-Null
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Jules" -KeyUsage DigitalSignature -FriendlyName "JulesClient Release Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        Export-Certificate -Cert $cert -FilePath "AppPackages/JulesClient.cer" | Out-Null
        Write-Output "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: msbuild JulesClient.sln /t:Restore /p:Configuration=Release

    - name: Build and sign MSIX package
      run: msbuild JulesClient.csproj /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="AppPackages/" /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint="${{ steps.create_cert.outputs.thumbprint }}"

    - name: Verify MSIX package output
      shell: pwsh
      run: |
        Get-ChildItem -Path AppPackages -Recurse

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_gen.outputs.tag_name }}
        files: |
          AppPackages/**/*.msix
          AppPackages/JulesClient.cer
        body: |
          ## Installation Instructions
          To install this app package via sideloading:
          1. Download both the `.msix` package and the `JulesClient.cer` certificate file.
          2. Double-click `JulesClient.cer` and click **Install Certificate...**
          3. Select **Local Machine** and click **Next**.
          4. Choose **Place all certificates in the following store** -> **Browse** -> **Trusted Root Certification Authorities**.
          5. Complete the wizard to import the certificate.
          6. Double-click the `.msix` file to install **JulesClient**.
        generate_release_notes: true
